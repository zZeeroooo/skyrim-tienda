<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto</title>
    <link rel="stylesheet" href="../assets/css/styles-admin.css">
</head>
<body>
    <header class="admin-header">
        <a class="brand" href="index.html">ADMINISTRACIÓN</a>
        <a class="button small secondary" href="../index.html">Ir a tienda</a>
    </header>

    <nav class="admin-sidebar" aria-label="Menú administrador">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="ordenes.html">Órdenes</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="nuevo-producto.html">Nuevo producto</a>
        <a href="nuevo-usuario.html">Nuevo usuario</a>
    </nav>

<main class="admin-main">
    <section class="form-section">
        <div class="form-card wide">
            <h1>Nuevo producto</h1>
            <p class="form-intro">Formulario base para crear un producto.</p>
            <form id="productForm" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productCode">Código producto</label>
                        <input id="productCode" name="code" type="text" minlength="3" required><small id="productCodeError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productName">Nombre</label>
                        <input id="productName" name="name" type="text" maxlength="100" required><small id="productNameError" class="error-message"></small>
                    </div>

                    <div class="form-group form-span-2">
                        <label for="productDescription">Descripción</label><textarea id="productDescription" name="description" maxlength="500" rows="4"></textarea><small id="productDescriptionError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Precio</label>
                        <input id="productPrice" name="price" type="number" min="0" step="0.01" required><small id="productPriceError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productStock">Stock</label><input id="productStock" name="stock" type="number" min="0" step="1" required><small id="productStockError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="criticalStock">Stock crítico</label>
                        <input id="criticalStock" name="criticalStock" type="number" min="0" step="1"><small id="criticalStockError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productGuild">Gremio</label>
                        <select id="productGuild" name="guild" required>
                            <option value="">Selecciona un gremio</option>
                            <option value="herreria">Herrería</option>
                            <option value="alquimia">Alquimia</option>
                            <option value="bienesGenerales">Bienes generales</option>
                            <option value="ropaFina">Ropa fina</option>
                            <option value="comida">Comida y taberna</option>
                            <option value="magia">Magia</option>
                        </select>
                        <small id="productGuildError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productCategory">Tipo de producto</label>
                        <select id="productCategory" name="category" required disabled>
                            <option value="">Selecciona primero un gremio</option>
                        </select>
                        <small id="productCategoryError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productImage">Imagen</label>
                        <input id="productImage" name="image" type="file" accept="image/*">
                        <small id="productImageError" class="error-message"></small>
                    </div>

                    <div class="form-group">
                        <label for="productExistingImage">Reutilizar imagen existente</label>
                        <select id="productExistingImage" name="existingImage">
                            <option value="">Selecciona una imagen existente (opcional)</option>
                        </select>
                        <small>Si seleccionas una imagen existente, no necesitas subir un archivo.</small>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="button secondary" href="productos.html">Cancelar</a>
                    <button class="button" type="submit">Guardar producto</button>
                </div>
                <p id="productSuccess" class="success-message"></p>

            </form>
        </div>
    </section>
</main>
    <script src="../js/inventario.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
