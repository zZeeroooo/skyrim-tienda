<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión - Gremios y Mercaderes de Skyrim</title>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="login-page">

    <main class="login-container">

        <a href="index.html" class="login-volver">
            ← Volver a la tienda
        </a>

        <img
            src="assets/img/skyrim-logo.png"
            alt="Skyrim"
            class="login-logo"
        >

        <h1>Inicio de Sesión</h1>

        <p class="login-subtitulo">
            Gremios y Mercaderes de Skyrim
        </p>

        <form id="loginForm" novalidate>

            <div class="campo">
                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="100"
                    placeholder="ejemplo@duoc.cl"
                    required
                >

                <span id="emailError" class="error"></span>
            </div>


            <div class="campo">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="4"
                    maxlength="10"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <span id="passwordError" class="error"></span>
            </div>


            <button type="submit" id="btn-entrar">
                Entrar a Skyrim
            </button>

            <p id="formSuccess" class="success"></p>

        </form>

        <p class="login-registro">
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
        </p>

    </main>


    <script src="js/datos-usuarios.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/formularios.js"></script>

</body>
</html>
